[project]
name = "edgefront-api"
version = "0.1.0"
description = "EdgeFront read-only JSON API (reads Postgres only; never contacts upstream)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edgefront-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgefront_api"]
