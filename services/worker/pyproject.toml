[project]
name = "edgefront-worker"
version = "0.1.0"
description = "EdgeFront ingest worker: the only process that contacts upstream sources"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edgefront-core",
  "apscheduler>=3.10,<4",
  "httpx>=0.28",
  "herbie-data>=2026.10.0",
  "ecmwf-opendata>=0.3.35",
  "eccodes>=2.50.1",
  "cfgrib>=0.9.15.1",
  "xarray>=2026.9.0",
  "numpy>=2.5.5",
  "scipy>=1.18.1",  # netCDF-3 reader for HFMETAR (v2 Phase 9)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgefront_worker"]
