[project]
name = "edgefront-worker"
version = "0.1.0"
description = "EdgeFront ingest worker: the only process that contacts upstream sources"
requires-python = ">=3.12,<3.13"
dependencies = [
  "edgefront-core",
  "apscheduler>=3.10,<4",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgefront_worker"]
