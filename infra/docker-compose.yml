# Local stack: docker compose -f infra/docker-compose.yml up --build
# Reads ../.env (copy .env.example to .env first).
name: edgefront

x-python-env: &python-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://edgefront:edgefront@postgres:5432/edgefront}
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  METAR_POLL_SECONDS: ${METAR_POLL_SECONDS:-180}
  DSM_POLL_SECONDS: ${DSM_POLL_SECONDS:-600}
  FORECAST_POLL_SECONDS: ${FORECAST_POLL_SECONDS:-1800}
  MODEL_POLL_SECONDS: ${MODEL_POLL_SECONDS:-900}
  STALE_METAR_MINUTES: ${STALE_METAR_MINUTES:-90}
  WORKER_UPSTREAM_ENABLED: ${WORKER_UPSTREAM_ENABLED:-true}

services:
  postgres:
    image: postgres:18.7-bookworm  # same version as Railway's Postgres (18.7)
    environment:
      POSTGRES_USER: edgefront
      POSTGRES_PASSWORD: edgefront
      POSTGRES_DB: edgefront
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql  # Postgres 18+ layout (data in /var/lib/postgresql/18/docker)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro  # creates edgefront_test (first start only)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgefront -d edgefront"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply Alembic migrations and seed the station registry before api/worker start.
  # Enrichment is a manual one-off (needs CONTACT_EMAIL): docker compose run --rm migrate python -m edgefront_core.enrich_stations
  migrate:
    build: { context: .., dockerfile: services/api/Dockerfile }
    command: ["sh", "-c", "python -m edgefront_core.migrate && python -m edgefront_core.seed"]
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: services/api/Dockerfile }
    environment:
      <<: *python-env
      PORT: "8000"
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    environment: *python-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # v2 accounts (auth schema in the same database; owner steps in infra/auth-setup.md)
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://edgefront:edgefront@postgres:5432/edgefront}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-compose-local-only-secret-0123456789abcdef}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
