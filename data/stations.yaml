# EdgeFront station registry (CONTEXT.md §5). Loaded by: python -m edgefront_core.seed
#
# - Venue mappings are ILLUSTRATIVE and UNVERIFIED (verified: false) until someone checks the
#   venue's current market rules and fills market, settlement_source, rules_url and verified_at.
# - kind: high | low. v1 is highs only (owner, Q16): every mapping stays kind: high and
#   unverified. Low markets are a later version; the schema already supports them.
# - dsm_location / dsm_source: the DSM<LOC> product and where we fetch it (Phase 3, owner Q14/Q17):
#   nws_api = api.weather.gov (KNYC, KMSP, KSAT); iem = Iowa Environmental Mesonet AFOS archive
#   (the other 24, issued as CDUS27 by ARTCCs). null = no DSM issued (KBKF). Evidence:
#   docs/coverage/2026-11-24_dsm_cli.md
# - cli_location: the CLI<LOC> Daily Climate Report location on api.weather.gov; null = no
#   current CLI (KDAL, KBKF).
# - pfm_point: the point-name line of the office's PFM block (office = nws_office) whose
#   coordinates are clearly nearest this station (Phase 1 discovery, 2026-11-24, <= 3 km and
#   unambiguous). null = no such point.
# - aliases: extra search terms for the site search (city nicknames, IATA codes), e.g. NYC, DC.
# - native_temp_unit: the unit the station measures in (v2 Phase 9, Q36). Default F: ASOS stations
#   measure in whole °F and their METAR tenths °C are conversions (2026-11-27: every T-group value
#   of 27 stations within ±0.09 °F of a whole °F, 3,031 reports). KBKF (military) measures in °C
#   (19 of 94). A weekly worker check warns if a station's data stop matching this.
# - five_minute_feed: whether the station is in the NOAA MADIS 5-minute ASOS feed (Premium, v2
#   Phase 9). Default true. false = not in the feed at all (checked on every real file, 2026-11-25
#   to 2026-11-28): KNYC (Central Park is not an FAA ASOS) and KBKF (military). Premium shows their
#   hourly METAR; every "5-minute data for N of M stations" text on the site is counted from this.
# - Seed semantics: a null dsm_location/pfm_point never overwrites a stored value; venues
#   below are the full truth for each station.

