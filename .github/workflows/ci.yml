name: CI

on:
  push:
    branches: [main, "phase-*", "v2-phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-bookworm  # same version as the Railway Postgres service (18.7)
        env:
          POSTGRES_USER: edgefront
          POSTGRES_PASSWORD: edgefront
          POSTGRES_DB: edgefront_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edgefront" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      # The whole Python suite runs on Postgres (production DB). SQLite is a local shortcut only.
      TEST_DATABASE_URL: postgresql+psycopg://edgefront:edgefront@localhost:5432/edgefront_test
      REQUIRE_POSTGRES: "1"
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/core/src services/api/src services/worker/src conftest.py packages/core/tests services/api/tests services/worker/tests services/backup
      - name: Migrations up, down to base, up again (Postgres)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run python -m edgefront_core.migrate up head
          uv run python -m edgefront_core.migrate down base
          uv run python -m edgefront_core.migrate up head
      - name: Tests (Postgres)
        run: uv run pytest -ra --junitxml=pytest.xml
      - name: Failed tests as annotations
        if: failure()
        run: test -f pytest.xml && python tools/ci_annotate.py junit pytest.xml || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @edgefront/web lint
      - run: pnpm --filter @edgefront/web typecheck
      - run: pnpm --filter @edgefront/web format:check
      - run: pnpm --filter @edgefront/web test
      - run: pnpm --filter @edgefront/web build
      - name: No secrets in the client bundle
        run: node apps/web/scripts/check-bundle.mjs

  auth:
    # v2 accounts on the production database: Alembic's auth schema must be exactly what Better
    # Auth expects, and the sign-in flows must work on Postgres (local runs use SQLite).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: edgefront
          POSTGRES_PASSWORD: edgefront
          POSTGRES_DB: edgefront
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edgefront" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://edgefront:edgefront@localhost:5432/edgefront
      APP_ENV: test
      WORKER_UPSTREAM_ENABLED: "false"
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:8000
      EMAIL_OUTBOX_FILE: ${{ github.workspace }}/outbox.jsonl
      E2E_EMAIL_OUTBOX: ${{ github.workspace }}/outbox.jsonl
      E2E_FAKE_GOOGLE_URL: http://localhost:4455
      AUTH_TEST_IP_LIMIT_SCALE: "100"
      RATE_LIMIT_PER_MINUTE: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen --python 3.12
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed (the api pre-deploy step)
        run: uv run python -m edgefront_core.deploy_db
      - name: Better Auth sees no schema drift
        run: node apps/web/scripts/auth-schema-check.mjs
      - run: pnpm --filter @edgefront/web build
      - name: The auth secret is not in the client bundle
        run: node apps/web/scripts/check-bundle.mjs
      - run: pnpm --filter @edgefront/web exec playwright install --with-deps chromium
      - name: Start api and web
        run: |
          PORT=8000 nohup uv run python -m edgefront_api.serve > api.log 2>&1 &
          nohup pnpm --filter @edgefront/web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/v1/health > /dev/null && curl -fsS http://localhost:3000/api/health > /dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Account flows (Playwright, fake Google, emails to a file)
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/pw.xml
        run: pnpm --filter @edgefront/web exec playwright test e2e/auth.spec.ts --reporter=list,junit
      - name: Logs as annotations
        if: failure()
        run: |
          test -f pw.xml && python3 tools/ci_annotate.py junit pw.xml head || true
          python3 tools/ci_annotate.py text "api" api.log || true
          python3 tools/ci_annotate.py text "web" web.log || true

  audit:
    runs-on: ubuntu-latest
    env:
      # CI must never contact NOAA/NWS/IEM: the worker runs its heartbeat only.
      WORKER_UPSTREAM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: npm advisories (production dependencies)
        run: pnpm audit --prod
      - name: Python advisories (locked production dependencies)
        run: |
          uv export --frozen --no-dev --no-emit-workspace --no-hashes --all-packages > requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    env:
      # CI must never contact NOAA/NWS/IEM/ECMWF: the worker runs heartbeat + retention only.
      WORKER_UPSTREAM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          docker compose -f infra/docker-compose.yml build
          docker build -f services/backup/Dockerfile -t edgefront-backup .
          docker run --rm --entrypoint pg_dump edgefront-backup --version | tee pg_dump_version.txt
          grep -q "pg_dump (PostgreSQL) 18\." pg_dump_version.txt  # must match prod (18.x)
      - name: Bring the stack up and check health
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180 api worker web
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000/ | grep -q "Observed weather at the U.S. stations"
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/auth/get-session  # web image reaches the auth schema
          curl -fsSI http://localhost:3000/ | grep -qi "x-robots-tag: noindex"
          sleep 65
          docker compose -f infra/docker-compose.yml logs worker | grep -c '"msg": "heartbeat"'
      - name: Service logs as annotations
        if: failure()
        run: |
          for svc in migrate api worker web postgres; do
            docker compose -f infra/docker-compose.yml logs --no-color "$svc" > "log-$svc.txt" 2>&1 || true
            python3 tools/ci_annotate.py text "docker $svc" "log-$svc.txt"
          done
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
