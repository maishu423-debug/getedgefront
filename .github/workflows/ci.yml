name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edgefront
          POSTGRES_PASSWORD: edgefront
          POSTGRES_DB: edgefront_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edgefront" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      # The whole Python suite runs on Postgres (production DB). SQLite is a local shortcut only.
      TEST_DATABASE_URL: postgresql+psycopg://edgefront:edgefront@localhost:5432/edgefront_test
      REQUIRE_POSTGRES: "1"
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/core/src services/api/src services/worker/src conftest.py packages/core/tests services/api/tests services/worker/tests
      - name: Migrations up, down to base, up again (Postgres)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run python -m edgefront_core.migrate up head
          uv run python -m edgefront_core.migrate down base
          uv run python -m edgefront_core.migrate up head
      - name: Tests (Postgres)
        run: uv run pytest -ra

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @edgefront/web lint
      - run: pnpm --filter @edgefront/web typecheck
      - run: pnpm --filter @edgefront/web format:check
      - run: pnpm --filter @edgefront/web test
      - run: pnpm --filter @edgefront/web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose -f infra/docker-compose.yml build
      - name: Bring the stack up and check health
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180 api worker web
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000/ | grep -q "Observed weather at the U.S. stations"
          sleep 65
          docker compose -f infra/docker-compose.yml logs worker | grep -c '"msg": "heartbeat"'
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
